<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620"><rect width="1000" height="620" rx="22" fill="#fff3f3"/><style>text{font-family:Arial,sans-serif;fill:#6c2929}.t{font-size:25px;font-weight:bold}.h{font-size:20px;font-weight:bold}.p{font-size:17px}</style><text x="35" y="42" class="t">Modelos de las actividades · UD06</text><g fill="white" stroke="#ce6161" stroke-width="2"><rect x="30" y="65" width="455" height="240" rx="12"/><rect x="515" y="65" width="455" height="240" rx="12"/><rect x="30" y="335" width="455" height="240" rx="12"/><rect x="515" y="335" width="455" height="240" rx="12"/></g><text x="50" y="98" class="h">ACT_UN6_1 · Auditar respuesta</text><text x="50" y="145" class="p">Dato dudoso: fecha sin fuente.</text><text x="50" y="180" class="p">Acción: buscar en una web oficial.</text><text x="535" y="98" class="h">ACT_UN6_2 · Posible sesgo</text><text x="535" y="145" class="p">Solo aparecen hombres científicos.</text><text x="535" y="180" class="p">Mejora: ampliar datos y revisar diversidad.</text><text x="50" y="368" class="h">ACT_UN6_3 · Declaración de uso</text><text x="50" y="410" class="p">“Usé IA para obtener tres ideas.</text><text x="50" y="445" class="p">Comprobé los datos y redacté el texto final”.</text><text x="535" y="368" class="h">ACT_UN6_4 · Argumento</text><text x="535" y="410" class="p">Opinión: no usar reconocimiento facial.</text><text x="535" y="445" class="p">Razón: trata datos biométricos.</text><text x="535" y="480" class="p">Propuesta: usar una tarjeta anónima.</text></svg>
