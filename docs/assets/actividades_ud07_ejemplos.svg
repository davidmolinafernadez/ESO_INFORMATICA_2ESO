<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620"><rect width="1000" height="620" rx="22" fill="#eefcfb"/><style>text{font-family:Arial,sans-serif;fill:#145d58}.t{font-size:25px;font-weight:bold}.h{font-size:20px;font-weight:bold}.p{font-size:17px}</style><text x="35" y="42" class="t">Modelos de las actividades · UD07</text><g fill="white" stroke="#3a9d95" stroke-width="2"><rect x="30" y="65" width="455" height="240" rx="12"/><rect x="515" y="65" width="455" height="240" rx="12"/><rect x="30" y="335" width="455" height="240" rx="12"/><rect x="515" y="335" width="455" height="240" rx="12"/></g><text x="50" y="98" class="h">ACT_UN7_1 · Evento y movimiento</text><text x="50" y="145" class="p">Al pulsar bandera → ir a x:0 y:-140</text><text x="50" y="180" class="p">Al pulsar → → cambiar x por 10</text><text x="535" y="98" class="h">ACT_UN7_2 · Puntos y final</text><text x="535" y="145" class="p">Si toca contenedor → puntos +1</text><text x="535" y="180" class="p">Si puntos = 10 → “¡Ganaste!”</text><text x="50" y="368" class="h">ACT_UN7_3 · Registro de error</text><text x="50" y="410" class="p">Error: puntos empieza en 6.</text><text x="50" y="445" class="p">Causa: falta “fijar Puntos a 0”.</text><text x="50" y="480" class="p">Prueba: reiniciar dos veces → correcto.</text><text x="535" y="368" class="h">ACT_UN7_4 · Pantallas</text><text x="535" y="410" class="p">INICIO: título + teclas + objetivo</text><text x="535" y="445" class="p">FINAL: puntuación + mensaje</text><text x="535" y="480" class="p">CRÉDITOS: autor + fuentes</text></svg>
