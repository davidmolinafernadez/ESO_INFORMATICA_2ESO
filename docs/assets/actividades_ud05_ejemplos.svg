<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620"><rect width="1000" height="620" rx="22" fill="#f7f1ff"/><style>text{font-family:Arial,sans-serif;fill:#4b2b70}.t{font-size:25px;font-weight:bold}.h{font-size:20px;font-weight:bold}.p{font-size:17px}</style><text x="35" y="42" class="t">Modelos de las actividades · UD05</text><g fill="white" stroke="#8460b0" stroke-width="2"><rect x="30" y="65" width="455" height="240" rx="12"/><rect x="515" y="65" width="455" height="240" rx="12"/><rect x="30" y="335" width="455" height="240" rx="12"/><rect x="515" y="335" width="455" height="240" rx="12"/></g><text x="50" y="98" class="h">ACT_UN5_1 · ¿IA o automatización?</text><text x="50" y="145" class="p">Alarma fija → automatización</text><text x="50" y="180" class="p">Reconocer una cara → IA</text><text x="535" y="98" class="h">ACT_UN5_2 · Árbol de decisión</text><text x="535" y="145" class="p">¿Llueve? ─ sí → lleva paraguas</text><text x="535" y="180" class="p">└ no → ¿hace frío? → chaqueta</text><text x="50" y="368" class="h">ACT_UN5_3 · Mejorar instrucción</text><text x="50" y="410" class="p">Débil: “Explícame Internet”.</text><text x="50" y="445" class="p">Mejor: “Explícalo en 5 líneas para 2.º ESO</text><text x="50" y="475" class="p">y añade un ejemplo cotidiano”.</text><text x="535" y="368" class="h">ACT_UN5_4 · Verificación</text><text x="535" y="410" class="p">Afirmación: el pulpo tiene 3 corazones.</text><text x="535" y="445" class="p">Fuente comprobada: National Geographic.</text><text x="535" y="480" class="p">Resultado: confirmada.</text></svg>
