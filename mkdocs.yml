site_name: Informática · 2.º ESO
site_description: Aula digital de Informática para 2.º ESO
site_url: https://davidmolinafernadez.github.io/ESO_INFORMATICA_2ESO/
theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro
plugins:
  - search:
      lang: es
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra_css:
  - stylesheets/extra.css
nav:
  - Inicio: index.md
  - Temporalización: temporalizacion.md
  - Entregas en Aules: aules.md
  - UD1 · Mi entorno digital:
      - Presentación: ud1/index.md
      - 1 · Archivos y carpetas: ud1/01-archivos-carpetas.md
      - 2 · Nube y permisos: ud1/02-nube-permisos.md
      - 3 · Buscar y comprobar: ud1/03-buscar-comprobar.md
      - 4 · Ciudadanía digital: ud1/04-ciudadania-digital.md
      - Actividades puntuables: ud1/actividades.md
      - Proyecto final: ud1/proyecto-final.md
      - Evaluación: ud1/evaluacion.md
  - UD2 · Conozco mi ordenador: ud2/index.md
  - UD3 · Redes y seguridad: ud3/index.md
  - UD4 · Documentos y datos: ud4/index.md
  - UD5 · Creación multimedia: ud5/index.md
  - UD6 · Programación y web: ud6/index.md
  - Proyecto final del curso: proyecto-final/index.md
